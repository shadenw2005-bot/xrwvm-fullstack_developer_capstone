<!DOCTYPE html>
<html>
<head><title>Post Review</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light" style="background-color:mediumspringgreen">
    <a class="navbar-brand"><b>Dealerships</b></a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
            <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
        </ul>
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link"><b>root</b> | Logout</a></li>
        </ul>
    </div>
</nav>
<div class="container mt-3">
    <h2>Post Review for Bytecard Car Dealership</h2>
    <form>
        <div class="form-group">
            <label>Review</label>
            <textarea class="form-control">Fantastic services! Very professional staff.</textarea>
        </div>
        <div class="form-group">
            <label>Purchase Date</label>
            <input type="date" class="form-control" value="2024-01-15">
        </div>
        <div class="form-group">
            <label>Car Make</label>
            <input type="text" class="form-control" value="Audi">
        </div>
        <div class="form-group">
            <label>Car Model</label>
            <input type="text" class="form-control" value="A6">
        </div>
        <div class="form-group">
            <label>Car Year</label>
            <input type="number" class="form-control" value="2023">
        </div>
        <button type="submit" class="btn btn-primary">Submit Review</button>
    </form>
</div>
</body>
</html>
