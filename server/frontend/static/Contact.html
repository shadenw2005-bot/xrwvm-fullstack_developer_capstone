<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light" style="background-color:mediumspringgreen">
    <a class="navbar-brand" href="/"><b>Dealerships</b></a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
            <li class="nav-item active"><a class="nav-link" href="/contact">Contact Us</a></li>
        </ul>
    </div>
</nav>
<div class="container mt-4">
    <h1>Contact Us</h1>
    <div class="row">
        <div class="col-md-6">
            <h4>Head Office</h4>
            <p>123 Auto Drive, New York, NY 10001</p>
            <p>Phone: +1 (800) 123-4567</p>
            <p>Email: info@bestcars.com</p>
            <img src="https://images.unsplash.com/photo-1486006920555-c77dcf18193c?w=400" class="img-fluid mt-2">
        </div>
        <div class="col-md-6">
            <h4>Send us a message</h4>
            <form>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <input type="email" class="form-control" placeholder="Your Email">
                </div>
                <div class="form-group">
                    <textarea class="form-control" rows="4" placeholder="Your Message"></textarea>
                </div>
                <button type="submit" class="btn btn-success">Send</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
